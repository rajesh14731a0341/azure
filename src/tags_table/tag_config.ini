# =============================================================
# Purview Tagger — Configuration File
# Edit this file only — no need to touch purview_tagger.py
# =============================================================

[FILES]
# Runtime output — generated every run, uploaded to artifacts
TAG_EXCEL_FILE  = purview_tags.xlsx

# Parameter file — download purview_tags.xlsx from artifacts,
# fill add_tags / delete_tags columns, save as this file, commit
TAG_PARAMS_FILE = tag_params.xlsx


[FILTERS]
# Control which assets are scanned
#
# FILTER_COLLECTIONS:
#   None                                           = scan everything
#   POC_Finastra/Lending-POS                       = one collection
#   POC_Finastra/UK Region, POC_Finastra/US Region = multiple
#
FILTER_COLLECTIONS = POC_Finastra/Lending-POS 

# FILTER_DATA_SOURCES:
#   None                           = scan everything
#   finastra-onprem-oracle         = one source
#   finastra-onprem-oracle, other  = multiple sources
#
FILTER_DATA_SOURCES = None