# =============================================================
# purview_config.ini
# =============================================================
[PURVIEW]

# ── Output ────────────────────────────────────────────────────
JSON_OUTPUT_FOLDER = json_output
SNAPSHOT_FILE      = purview_snapshot.json

# ── Collection Filter ─────────────────────────────────────────
COLLECTIONS_FILTER = POC_Finastra / Azure SQL Task

# ── Time window ───────────────────────────────────────────────
LAST_RUN = all

# ── Parallelism ───────────────────────────────────────────────
MAX_WORKERS = 100

# ── Compliance Check ──────────────────────────────────────────
YAML_SOURCE      = C:\Users\RajeshPuchakayala\OneDrive - Wavicle Data Solutions\Desktop\project\perview\src\DMG_main
COMPLIANCE_DMG   = DMG0002303
# Excel is written next to purview_scan.py (NOT inside json_output/).
# Overwritten completely on every run — never accumulates.
COMPLIANCE_REPORT = compliance_report.xlsx

# ── YAML Source Mode ──────────────────────────────────────────
#
# Exactly ONE of the three modes must be true. If more than one is true,
# priority is: GITHUB first, then AZURE_BLOB, then LOCAL.
#
# YAML_SOURCE_GITHUB = true
#   → Load YAML(s) from GitHub (public or private).
#   → Uses YAML_SOURCE as the repo URL (blob, tree, or raw URL).
#   → For PUBLIC repos: leave YAML_GITHUB_TOKEN blank.
#   → For PRIVATE repos: set YAML_GITHUB_TOKEN to a Personal Access Token
#     (classic PAT with repo scope, or fine-grained with Contents: Read).
#
# YAML_SOURCE_AZURE_BLOB = true
#   → Load YAML(s) from Azure Blob Storage.
#   → YAML_BLOB_ACCOUNT  : storage account name
#   → YAML_BLOB_CONTAINER: container name
#   → YAML_BLOB_PREFIX   : (optional) folder prefix — loads all *.yaml under it
#   → YAML_BLOB_SAS_TOKEN: SAS token (starts with "?sv=...") OR leave blank
#     and set the YAML_BLOB_CONN_STR key to a full connection string instead.
#
# YAML_SOURCE_LOCAL = true
#   → Load YAML(s) from the local filesystem.
#   → YAML_SOURCE is used as the local path (file or directory).
#
YAML_SOURCE_GITHUB     = false
YAML_SOURCE_AZURE_BLOB = false
YAML_SOURCE_LOCAL      = true

# GitHub auth — only needed for PRIVATE repos.
# Leave blank for public repos (no token required).
YAML_GITHUB_TOKEN =

# Azure Blob — only needed when YAML_SOURCE_AZURE_BLOB = true.
YAML_BLOB_ACCOUNT   =
YAML_BLOB_CONTAINER =
YAML_BLOB_PREFIX    =
YAML_BLOB_SAS_TOKEN =
YAML_BLOB_CONN_STR  =

# ── Compliance DB Load ────────────────────────────────────────
#
# COMPLIANCE_DB_LOAD = true
#   → After the Excel is written, push all compliance rows to Azure SQL.
#   → Script exits with error if COMPLIANCE_DB_SCHEMA or COMPLIANCE_DB_TABLE
#     are blank — both are MANDATORY when db load is enabled.
#
# COMPLIANCE_DB_LOAD = false  (default)
#   → Skip DB push entirely.  Excel-only mode.
#
COMPLIANCE_DB_LOAD = false

# MANDATORY when COMPLIANCE_DB_LOAD = true.
# Script will not start if either is blank while db load is enabled.
COMPLIANCE_DB_SCHEMA = compliance
COMPLIANCE_DB_TABLE  = pipeda_compliance_detail

# Azure SQL connection — same credentials used for the main SQL push.
# If SQL_SERVER / SQL_DATABASE / SQL_USER / SQL_PASSWORD are already set
# above, those are reused automatically.  Override here only if the
# compliance data goes to a different database.
SQL_SERVER   = finastra-mspurview.database.windows.net
SQL_DATABASE = finastra-sql-mspurview
SQL_USER     = finastramspadmin
SQL_PASSWORD = Wavicle@2026