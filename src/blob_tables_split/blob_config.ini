# =============================================================
# Blob SQL to CSV — Configuration File
# Set ACTIVE_PIPELINE to switch between pipelines.
# Add new pipelines by following the same naming pattern.
# =============================================================

[BLOB]
ACTIVE_PIPELINE = BAWE

# ---- EIPP ----
EIPP_INPUT_CONTAINER          = eipp-input
EIPP_OUTPUT_CONTAINER         = eipp-output
EIPP_INPUT_ARCHIVE_CONTAINER  = eipp-input-archive
EIPP_OUTPUT_ARCHIVE_CONTAINER = eipp-output-archive

# ---- BAWE ----
BAWE_INPUT_CONTAINER          = bawe-input
BAWE_OUTPUT_CONTAINER         = bawe-output
BAWE_INPUT_ARCHIVE_CONTAINER  = bawe-input-archive
BAWE_OUTPUT_ARCHIVE_CONTAINER = bawe-output-archive

# ---- Add future pipelines below, same pattern ----
# XYZ_INPUT_CONTAINER          = xyz-input
# XYZ_OUTPUT_CONTAINER         = xyz-output
# XYZ_INPUT_ARCHIVE_CONTAINER  = xyz-input-archive
# XYZ_OUTPUT_ARCHIVE_CONTAINER = xyz-output-archive