# =============================================================
# purview_config.ini
# =============================================================
[PURVIEW]

# ── Output ────────────────────────────────────────────────────
# Folder where all JSON files are written.
JSON_OUTPUT_FOLDER = json_output

# Name of the main snapshot file (written inside JSON_OUTPUT_FOLDER).
# This file contains every asset with every column fully detailed.
SNAPSHOT_FILE      = purview_snapshot.json

# ── Collection Filter ─────────────────────────────────────────
# Use 'none' to include all collections.
# Otherwise provide a comma-separated list of hierarchy path
# prefixes.  Matching is case-insensitive and ignores whitespace
# around '/' so "POC_Finastra/Azure SQL Task" matches
# "POC_Finastra / Azure SQL Task".
#
# Example:
#   COLLECTIONS_FILTER = POC_Finastra/Azure SQL Task, POC_Finastra/Lending-POS
#
COLLECTIONS_FILTER = none

# ── Time window ───────────────────────────────────────────────
# Controls which columns are flagged as 'in_timeframe_window'
# inside the snapshot.  All columns of all assets are always
# written to the snapshot regardless of this setting — this
# filter only sets the in_timeframe_window flag per column.
#
# Format : all | <N>min | <N>hr | <N>d
# Examples: all   7d   2hr   30min
#
# Filter signal priority (asset created/updated timestamps are
# NEVER used as the filter signal):
#   1. Classification lastModifiedTS  (most reliable)
#   2. MICROSOFT.* auto-scan cls (epoch-0) -> asset updateTime proxy
#   3. Sensitivity label/business tag -> column updateTime proxy
#
LAST_RUN = all

# ── Parallelism ───────────────────────────────────────────────
# Number of concurrent workers for the bulk entity fetch step.
# 50 is a good default; lower if you hit rate limits.
MAX_WORKERS = 100