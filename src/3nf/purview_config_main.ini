# =============================================================

# purview_config.ini  (FINAL — compatible with purview_final.py)

# =============================================================

[PURVIEW]

# ── Output ────────────────────────────────────────────────────

SCHEMA_NAME        = compliance
SQL_OUTPUT_FOLDER  = sql_output
JSON_OUTPUT_FOLDER = json_output
SNAPSHOT_FILE      = purview_snapshot.json

# ── ONLY TWO TABLES (MANDATORY) ───────────────────────────────

TBL_UNIFIED_CATALOG = unified_catalog
TBL_AUDIT_LOG       = change_audit_log

# ── Time window ───────────────────────────────────────────────

# Options:

# all     → full load

# 30min   → last 30 minutes

# 2hr     → last 2 hours

# 2d      → last 2 days

LAST_RUN = 7d

# ── Run SQL against Azure SQL after generating files ──────────

RUN_SQL_IN_DB = true

# ── Azure SQL connection details ──────────────────────────────

SQL_SERVER   = finastra-mspurview.database.windows.net
SQL_DATABASE = finastra-sql-mspurview
SQL_USER     = finastramspadmin
SQL_PASSWORD = Wavicle@2026
