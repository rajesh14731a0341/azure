# =============================================================
# purview_config.ini  (5-Table Mode)
# =============================================================
[PURVIEW]

# ── Output ────────────────────────────────────────────────────
SCHEMA_NAME        = compliance
SQL_OUTPUT_FOLDER  = sql_output
JSON_OUTPUT_FOLDER = json_output
SNAPSHOT_FILE      = purview_snapshot.json

# ── Collection Filter ─────────────────────────────────────────
# Use 'none' to fetch all collections globally.
# Otherwise, provide a comma-separated list of full hierarchical
# paths. The script will ONLY load assets from these collections
# into asset_registry.
# Example: Finance / Europe, HR / APAC
COLLECTIONS_FILTER = none

# ── 5 Tables (ALL MANDATORY) ──────────────────────────────────
#
# ALL five keys below are REQUIRED.
# The script exits immediately with a clear error message if any
# of these keys is missing or blank — no fallback defaults are used.
#
# Change the values freely to match your environment.
# These names are used in every DDL, MERGE, and runner script.
#
TBL_ASSET_REGISTRY = asset_registry
TBL_COLLECTIONS    = purview_collections
TBL_ENTITIES       = purview_entities
TBL_GLOSSARY       = purview_glossary_terms
TBL_SEARCH         = purview_search_assets

# ── Time window ───────────────────────────────────────────────
# Controls which assets go into asset_registry.
# purview_collections and purview_glossary_terms are always
# fetched in full regardless of this setting.
#
# Format : all | <N>min | <N>hr | <N>d
# Examples: all   7d   2hr   30min
#
# 'all'  → every enriched asset regardless of age
# '7d'   → only assets whose columns had classification applied,
#           sensitivity label applied, or business tag set
#           within the last 7 days
#
# IMPORTANT: The filter is applied using classification timestamps
# ONLY — asset created / updated timestamps are never used.
# Columns with labels or tags (but no classification timestamp)
# are included by presence alone.
#
LAST_RUN = all

# ── Part-file size ────────────────────────────────────────────
# Number of MERGE rows written per SQL file part.
MAX_ROWS_PER_FILE = 500

# ── Run SQL against Azure SQL after generating files ──────────
RUN_SQL_IN_DB = true

# ── Azure SQL connection details ──────────────────────────────
SQL_SERVER   = finastra-mspurview.database.windows.net
SQL_DATABASE = finastra-sql-mspurview
SQL_USER     = finastramspadmin
SQL_PASSWORD = Wavicle@2026